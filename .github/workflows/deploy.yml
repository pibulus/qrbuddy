name: Build check
on:
  push:
    branches: main
  pull_request:
    branches: main

jobs:
  build:
    name: Build check
    runs-on: ubuntu-latest

    permissions:
      contents: read # Needed to clone the repository

    steps:
      - name: Clone repository
        uses: actions/checkout@v4

      - name: Install Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      # Build check only — deploys are owned by Deno Deploy's git auto-build
      # (repo linked 2026-07-31), which runs deno.json's deploy.build remotely.
      # A CI `deno deploy` upload honours .gitignore, so _fresh never ships and
      # the tailwind plugin 500s every route with "Ahead of time builds not
      # configured". That buildless clobber took prod down 2026-08-07.
      - name: Build step
        run: "deno task build"
