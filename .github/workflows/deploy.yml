name: Check, unit tests, and build
on:
  push:
    branches: main
  pull_request:
    branches: main

jobs:
  build:
    name: Check, unit tests, and build
    runs-on: ubuntu-latest

    permissions:
      contents: read # Needed to clone the repository

    steps:
      - name: Clone repository
        uses: actions/checkout@v4

      - name: Install Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      # Keep these steps sequential: the Fresh check and build share generated
      # state, while the explicit unit list has no network permission.
      - name: Format, lint, and type check
        run: deno task check

      - name: Offline unit tests
        run: deno task test:unit

      # Production deployment is owned by Deno Deploy's Git-connected build.
      - name: Build Fresh
        run: deno task build
