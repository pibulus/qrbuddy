name: Deploy
on:
  push:
    branches: main
  pull_request:
    branches: main

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest

    permissions:
      id-token: write # Needed for auth with Deno Deploy
      contents: read # Needed to clone the repository

    steps:
      - name: Clone repository
        uses: actions/checkout@v4

      - name: Install Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Build step
        run: "deno task build"

      # Classic deployctl died 2026-07-20. New-platform CLI; org/app come
      # from deno.json's deploy block, env vars live on the app itself
      # (deno deploy env), auth via DENO_DEPLOY_TOKEN (console.deno.com).
      # --no-wait: the CLI's build-watcher hangs without a TTY.
      - name: Upload to Deno Deploy
        if: github.event_name == 'push'
        env:
          DENO_DEPLOY_TOKEN: ${{ secrets.DENO_DEPLOY_TOKEN }}
        run: deno deploy --prod --non-interactive --no-wait
