# Launch hints for Launch Arsenal.
# Human-vetted. The generated marker is gone, so these fields are trusted verbatim.
name: QRBuddy
slug: qrbuddy
app_type: web-app

audience: >-
  businesses, restaurants, agencies, designers, musicians, and event teams who print QR
  codes on menus, packaging, signage, and merch — and want every pro feature of Bitly,
  QR Code Monkey, and QR Tiger without ugly barcodes, mandatory accounts, or $35/mo
  hostage subscriptions

problem: >-
  mainstream QR platforms either hand out dated black-and-white barcodes or bait businesses
  with "free" dynamic codes that deactivate after 14 days unless you pay $120–$420/year

promise: Everything the big QR platforms do — designed for print, never held hostage.

one_liner: The full-stack QR studio that beats Bitly and QR Code Monkey on design, routing, analytics, and price.

cta: Create your QR at https://qrbuddy.app

voice: juicy
palette: pastel-punk

pricing: "~$32 USD (A$49) once for 365 days — zero auto-renew, free static studio forever"
pricing_anchor: "~$32 USD (A$49) once for 365 days vs. $120–$420/yr recurring SaaS traps"

