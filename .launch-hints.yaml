  - free qr code
  - what is a qr code
  - qr code scanner online
  - how to make a qr code

force_multiplier_personas:
  - "Brand, Print & Packaging Designers — buy 1 Passport (~$32 USD) to export WCAG-verified vector SVGs and dynamic links across 10–30 client menus, flyers, and product boxes"
  - "Hospitality & Multi-Venue Operators — run Breakfast/Lunch/Dinner time-routed menus, Wi-Fi cards, and table tents across 5–15 venues without a $35/mo per-seat SaaS bill"
  - "Print Shops, Signwriters & Merch Producers — use the 50-row Batch ZIP + manifest.csv engine to deliver print-ready 2400px PNG/SVG packs for entire client runs in one click"
  - "Boutique Marketing & Event Agencies — launch white-label Cover Pages, iOS/Android app splits, 500 MB press/audio drops, and 90-day CSV Field Reports for clients on a single pass"

differentiators:
  - Full-stack QR studio that replaces Bitly, QR Code Monkey, and QR Tiger — static & dynamic URLs, Wi-Fi, vCard, Social Bio Hubs, Photo Galleries, Audio Mixtapes, inbound File Lockers, and Bulk ZIP generation in one workspace
  - Print-verified design engine — 8 luminance-tested gradient palettes (≤ 0.40 contrast), custom 2-stop gradients, dot/corner geometry, center logo stamp, SCAN ME frames, live WCAG scannability badge, and 2400px PNG + vector SVG export
  - Smart Dynamic QRs without hostage pricing — edit destinations after printing, route by time-of-day (Breakfast/Lunch/Dinner menus), split by iOS/Android or A/B weights, add branded Cover Pages, or set scan/date limits
  - The QRBuddy Passport (~$32 USD / A$49 once for 365 days, zero auto-renew) — unlocks 100 editable dynamic links, 500 MB file drops, clean 1-click white-label pages, 4-word cross-device QR sync, and the 90-day Passport Field Report (top cities, 24h peak rush hour, track/photo leaderboard & RFC-4180 CSV export)
  - Street-Safe QR Inspector — scan any QR code to unroll up to 5 redirect hops, verify HTTPS, and inspect a live visual webpage preview before visiting
  - Fully bilingual out of the box — native English (/) and LatAm/Mexican Spanish (/es) with zero account wall

proof_points:
  - One smart input bar auto-detects URLs, text, Wi-Fi, vCards, or dragged-and-dropped PDFs, photo albums, and audio tracks
  - Dynamic QR codes support live destination edits, time-of-day menu schedules, iOS/Android device routing, and branded cover pages without reprinting a single poster or table tent
  - Passport Field Report delivers 7d/30d/90d scan trends, Top Cities & Countries, Peak Rush Hour windows, Browser/Device breakdown, and 1-click CSV export with zero creepy ad-tech or IP logging
  - No email/password sign-up wall — your cryptographic QRBuddy Passport pairs phone and desktop via a scannable QR or 4-word recovery key

objections:
  - >-
      "Can this actually replace Bitly, QR Tiger, or Uniqode for my business?" — Yes. You get
      dynamic redirects, conditional routing (time-of-day & iOS/Android), bulk ZIP generation,
      vector SVG export, white-label cover pages, and 90-day city/hour analytics with CSV export —
      for ~$32 USD (A$49) a year instead of $35/month.
  - >-
      "What happens to my printed codes if I don't renew?" — Unlike trial-trap generators that
      brick your printed menus after 14 days, static codes work offline forever and dynamic codes
      are never held hostage behind surprise auto-renewals.
  - >-
      "Will gradient QR codes scan reliably in dim bars or on glossy packaging?" — Every preset is
      luminance-capped (≤ 0.40) with Error Correction Level Q/H (25–30% recovery) and verified in
      real time by a built-in WCAG & Michelson contrast meter before export.

