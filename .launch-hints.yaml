# Launch hints for Launch Arsenal.
# Human-vetted. The generated marker is gone, so these fields are trusted verbatim.
name: QRBuddy
slug: qrbuddy
app_type: web-app

audience: >-
  small business owners, designers, event organisers and makers who put QR codes on real
  physical things — menus, stickers, posters, business cards — and refuse to ship an ugly
  black square or pay $30/mo for a tracking dashboard

problem: >-
  every QR generator is either a bare-bones ugly tool or an enterprise dashboard that
  charges monthly to edit a URL you already own

promise: Drop a link. Watch it bloom.

one_liner: Drop a link. Watch it bloom.

cta: Make one at https://qrbuddy.app

voice: juicy
palette: pastel-punk

differentiators:
  - Eight jewel-arc pastel-punk gradient styles (luminance-tested ≤ 0.40 so every code scans first try) plus a custom gradient creator & logo stamp
  - Street-Safe Mini-Browser QR Inspector — scan any street QR to unroll up to 5 redirect hops, check HTTPS, and see a live webpage preview without cookies before clicking
  - Daylight Pastel-Punk Media Drops — drop photos for an instant gallery slideshow, MP3/WAV tracks for a playable mixtape, or up to 500 MB of files
  - Self-destructing Time-Bomb codes & PIN-locked Secret Drops that work N times and then blow up with a full KABOOM page
  - The QRBuddy Passport (~$32 USD / A$49 for 365 days, zero subscription traps) — unlocks 100 editable dynamic links, 500 MB file drops, clean white-label pages, 4-word device sync, and the 90-day Passport Field Report (top cities, peak rush hour, track/photo leaderboard & CSV export)
  - Bilingual out of the box — English (/) and "buena onda" Mexican/LatAm Spanish (/es)

proof_points:
  - Paste a URL, type text, or drop photos/audio/files — it figures out which one you gave it in one input bar
  - Repoint printed QR codes anytime or route by time-of-day (Breakfast / Lunch / Dinner menus) without reprinting
  - Inspect sketchy street QR codes safely with a live visual webpage preview and unrolled redirect chain
  - Zero email or password accounts — your 4-word Sovereign Passport & scannable QR card sync your library and pro entitlement across phone and laptop instantly

objections:
  - >-
      "why not a free generator?" — most hand you a flat black-and-white square. The
      aesthetic gap shows up the second you put it on a poster.
  - >-
      "will the dynamic links stay up?" — the redirects are as durable as the hosting,
      and the whole thing is open source if you would rather self-host it.
  - >-
      "free with no catch?" — there are no scan analytics to sell, so there is nothing
      to monetise and nothing to upsell you to.

keywords:
  seed:
    - QR code generator
    - gradient QR code
    - self-destructing QR code
    - dynamic QR code free
    - QR code with logo
    - privacy QR generator
  audience: small business owners, designers and makers who print QR codes on physical materials
  intent:
    - make a QR code that looks good
    - free dynamic QR code no tracking
    - self-destructing QR code generator
    - WiFi QR code generator

links:
  website: https://qrbuddy.app
  github: https://github.com/pibulus/qrbuddy

notes:
  - Lead visuals with the gradient codes — the aesthetic gap is the whole pitch
  - The KABOOM page is the memorable brand moment, worth featuring
  - Destructible file sharing (not just URLs) widens this past normal QR tools
